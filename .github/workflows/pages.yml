name: KeyLog web yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --platforms=web --project-name anahtarlik .

      - run: sed -i 's/anahtarlik/KeyLog/g' web/index.html
      - run: sed -i 's/"name": "anahtarlik"/"name": "KeyLog"/; s/"short_name": "anahtarlik"/"short_name": "KeyLog"/' web/manifest.json

      - run: flutter pub get

      - run: dart run flutter_launcher_icons

      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
