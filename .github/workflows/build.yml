name: APK olustur

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create --platforms=android --project-name anahtarlik .

      # Uygulamanın telefondaki adı (KeyFlow yerine istediğini yazabilirsin)
      - run: sed -i 's/android:label="[^"]*"/android:label="KeyFlow"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # Logoyu (icon.png ve icon_fg.png) uygulamaya yerleştirir
      - run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: anahtarlik-apk
          path: build/app/outputs/flutter-apk/app-release.apk
