name: anahtarlik
description: KeyLog - anahtarlık stok ve kâr takibi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  share_plus: ^10.1.0
  file_picker: ^10.3.8
  image_picker: ^1.1.2
  web: ^1.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "icon.png"
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#111113"
    theme_color: "#C4B5FD"

flutter:
  uses-material-design: true
